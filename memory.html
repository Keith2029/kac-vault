<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory — KAC Vault</title><link rel="stylesheet" href="styles.css"></head><body><header class="sitebar"><a class="brand" href="index.html"><span>KAC</span><b>VAULT</b><small>COMICS · CARDS · COLLECTIBLES</small></a><button class="menu" aria-label="Open menu">☰</button><nav class="nav"><a href="collection.html">Collection</a><a href="games-memories.html">Games & Memories</a><a href="index.html#featured">Featured</a><a href="index.html#about">About</a><a class="pill" href="inventory.html">Full Inventory</a></nav></header><main id="memory"></main><footer><div><a class="footer-brand" href="index.html">KAC <b>VAULT</b></a><p>Collect · Preserve · Remember</p></div><div class="footer-note">Family archive · KAC Vault</div></footer><script src="data/memories-data.js"></script><script>
document.querySelector('.menu')?.addEventListener('click',()=>document.querySelector('.nav').classList.toggle('open'));
const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
Promise.resolve(window.KAC_MEMORIES||[]).then(all=>{const m=all.find(x=>x.id===id||x.image.includes(id));if(!m){document.getElementById('memory').innerHTML='<section class="memory-detail"><h1>Memory not found</h1><a class="text-link" href="games-memories.html">← Back to Games & Memories</a></section>';return;}document.title=m.title+' — KAC Vault';const gallery=((m.gallery||[]).length>1?(m.gallery||[]):[]).map((img,i)=>`<figure class="tile tile-${i%6}"><img src="${esc(img)}" alt="${esc(m.title)} photo ${i+1}"></figure>`).join('');document.getElementById('memory').innerHTML=`<section class="memory-story-hero"><div><a class="text-link light" href="games-memories.html">← Games & Memories</a><span class="eyebrow">${esc(m.sport)} · ${esc(m.date)}</span><h1>${esc(m.title)}</h1><p>${esc(m.subtitle)}</p></div><div class="score-card"><small>FINAL</small><strong>${esc(m.result)}</strong><span>${esc(m.venue)}</span></div></section><section class="memory-story"><div class="memory-story-photo">${(m.gallery||[]).length>1?`<img src="${esc(m.gallery[0])}" alt="${esc(m.title)}">`:`<div class="archive-placeholder"><span>ORIGINAL PHOTOS</span><strong>${esc(m.title)}</strong><small>Archive restored without computer-screen imagery</small></div>`}</div><aside><span class="eyebrow">THE GAME</span><h2>What happened.</h2><p>${esc(m.recap)}</p><div class="memory-facts"><div><small>DATE</small><b>${esc(m.date)}</b></div><div><small>VENUE</small><b>${esc(m.venue)}</b></div><div><small>RESULT</small><b>${esc(m.result)}</b></div></div><div class="box-score-wrap"><span class="eyebrow">BOX SCORE</span><p class="box-score-kicker">Scoring by period / inning from the historical game record.</p><div class="box-score" id="boxScore"></div><div class="game-leaders" id="gameLeaders"></div></div></aside></section><section class="memory-personal"><span class="eyebrow">THE MEMORY</span><h2>More than the final score.</h2><p>${esc(m.personalNote)}</p></section><section class="memory-gallery"><div class="section-heading"><span class="eyebrow">FROM THE ARCHIVE</span><h2>Photos from the day.</h2><p>An editorial collage built from the original photographs — the people, place and atmosphere around the game.</p></div><div class="memory-gallery-grid">${gallery}</div></section>`; const bs=document.getElementById("boxScore"); const table=rows=>`<table>${rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`; if(bs){if(m.boxScores?.length){bs.innerHTML=m.boxScores.map(x=>`<section class="box-score-game"><h3>${esc(x.title)}</h3>${table(x.rows)}</section>`).join("");}else if(m.boxScore){bs.innerHTML=table(m.boxScore);}else{bs.innerHTML=`<p class="box-score-unavailable">Detailed scoring data is being restored.</p>`;}} const gl=document.getElementById("gameLeaders"); if(gl&&m.leaders){gl.innerHTML=`<h3>Game leaders</h3>${m.leaders.map(x=>`<p>${esc(x)}</p>`).join("")}`;} }).catch(()=>document.getElementById('memory').innerHTML='<section class="memory-detail"><h1>Unable to load memory.</h1></section>');
</script></body></html>
